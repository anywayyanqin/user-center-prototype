  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ========== Icons (lucide-react equivalents) ==========
    const Icons = {

      Settings: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
      Home: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,

      ChevronRight: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>,
      ChevronDown: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
      Info: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>,
      Search: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
      XCircle: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
      X: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      AlertCircle: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
      ShieldCheck: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>,
      BadgeCheck: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
      Download: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
      Trash2: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
      Eye: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
      Phone: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
      CheckCircle2: () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>,
      ChevronUp: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>,
    };

    // ========== Header Component ==========
    const Header = () => (
      <header className="h-10 border-b border-gray-100 flex items-center justify-between px-4 bg-white sticky top-0 z-50 shadow-sm">
        <div className="text-sm font-semibold text-gray-700 flex items-center">
          客户机构一站式服务平台申请
        </div>
        <div className="flex items-center gap-4 text-gray-500">
          <button className="flex items-center gap-1.5 text-xs hover:text-gray-800 cursor-pointer">
            <Icons.LayoutGrid /> 事务中心
          </button>
          <button className="flex items-center gap-1.5 text-xs hover:text-gray-800 cursor-pointer">
            <Icons.Settings /> 设置
          </button>
          <div className="h-4 w-[1px] bg-gray-200 mx-1"></div>
          <button className="hover:text-gray-800 cursor-pointer"><Icons.Home /></button>
          <button className="hover:text-gray-800 cursor-pointer"><Icons.MessageCircle /></button>
        </div>
      </header>
    );

    // ========== FormField, Input, Select Components ==========
    const FormField = ({ label, required, children }) => (
      <div className="flex flex-col gap-1.5 w-full">
        <label className="text-sm text-gray-700 font-medium flex items-start">
          {required && <span className="text-red-500 mr-1">*</span>}
          {label}
        </label>
        {children}
      </div>
    );

    const Input = (props) => (
      <input
        {...props}
        className={`border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400 focus:border-blue-400 w-full bg-white transition-all ${props.disabled ? 'bg-gray-50 cursor-not-allowed' : ''} ${props.className || ''}`}
      />
    );

    const Select = ({ value, isOpen }) => (
      <div className={`border border-gray-200 rounded-md px-3 py-2 text-sm flex justify-between items-center cursor-pointer bg-white transition-all ${isOpen ? 'ring-1 ring-blue-400 border-blue-400' : ''}`}>
        <span className={value ? 'text-gray-800' : 'text-gray-400'}>{value || '请选择'}</span>
        <div className={`transition-transform duration-200 ${isOpen ? 'rotate-180 text-blue-500' : 'text-gray-400'}`}>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
      </div>
    );

    // ========== NestedCheckboxMenu Component ==========
    const menuData = [
      { id: '4', label: '企业签约认证' },
      { id: '1', label: '经纪业务', children: [
        { id: '1-1', label: '运营标准业务' },
        { id: '1-2', label: '次席资金业务', children: [
          { id: '1-2-1', label: '资金内转' },
          { id: '1-2-2', label: '资金划拨' }
        ]},
        { id: '1-3', label: '期权行权业务' },
      ]},
      { id: '2', label: 'API云市场', children: [
        { id: '2-1', label: '研究数据' },
        { id: '2-2', label: '行情', hasInfo: true },
        { id: '2-3', label: '交易参数' },
        { id: '2-4', label: '沪深交易所业务参数', hasInfo: true },
        { id: '2-5', label: '研报', hasInfo: true },
      ]},
      { id: '3', label: '交易咨询服务' },
      { id: '5', label: '指令交易(模拟)', disabled: true, requiresApplication: true },
    ];

    const NestedCheckboxMenu = ({ selected: externalSelected, onChange }) => {
      const [expanded, setExpanded] = useState(['1', '1-2', '2']);
      const [selected, setSelected] = useState(externalSelected || []);
      const [searchQuery, setSearchQuery] = useState('');

      const toggleExpand = (id) => {
        setExpanded(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const getLabelById = (id, items) => {
        for (const item of items) {
          if (item.id === id) return item.label;
          if (item.children) {
            const found = getLabelById(id, item.children);
            if (found) return found;
          }
        }
        return undefined;
      };

      const getAllLeafIds = (item) => {
        if (!item.children) return [item.id];
        return item.children.flatMap(getAllLeafIds);
      };

      const findItemById = (id, items) => {
        for (const item of items) {
          if (item.id === id) return item;
          if (item.children) {
            const found = findItemById(id, item.children);
            if (found) return found;
          }
        }
        return undefined;
      };

      const toggleSelect = (id) => {
        const item = findItemById(id, menuData);
        if (!item) return;

        const leafIds = getAllLeafIds(item);
        const allSelected = leafIds.every(lid => selected.includes(lid));

        let newSelected;
        if (allSelected) {
          newSelected = selected.filter(sid => !leafIds.includes(sid));
        } else {
          const toAdd = leafIds.filter(lid => !selected.includes(lid));
          newSelected = [...selected, ...toAdd];

          const triggersEnterprise = ['1', '2', '3'];
          const hasTrigger = newSelected.some(sid => triggersEnterprise.some(tid => sid.startsWith(tid)));
          if (hasTrigger && !newSelected.includes('4')) {
            newSelected.push('4');
          }
        }

        setSelected(newSelected);
        if (onChange) {
          const labels = newSelected.map(sid => getLabelById(sid, menuData)).filter(Boolean);
          onChange(newSelected, labels);
        }
      };

      const handleClearAll = () => {
        setSelected([]);
        if (onChange) onChange([], []);
      };

      const filteredMenuData = useMemo(() => {
        if (!searchQuery) return menuData;
        const filterItems = (items) => {
          return items.reduce((acc, item) => {
            const matches = item.label.toLowerCase().includes(searchQuery.toLowerCase());
            const filteredChildren = item.children ? filterItems(item.children) : [];
            if (matches || filteredChildren.length > 0) {
              acc.push({ ...item, children: filteredChildren.length > 0 ? filteredChildren : item.children });
            }
            return acc;
          }, []);
        };
        return filterItems(menuData);
      }, [searchQuery]);

      const renderItem = (item, depth = 0) => {
        const isExpanded = expanded.includes(item.id) || searchQuery !== '';
        const leafIds = getAllLeafIds(item);
        const isSelected = leafIds.length > 0 && leafIds.every(lid => selected.includes(lid));
        const isPartial = !isSelected && leafIds.some(lid => selected.includes(lid));

        // 处理需要单独申请的项目(不可勾选但可点击跳转)
        if (item.disabled && item.requiresApplication) {
          return (
            <div key={item.id} className="select-none">
              <div
                className="flex items-center py-2 px-3 hover:bg-gray-50 cursor-pointer group transition-colors"
                style={{ paddingLeft: `${depth * 16 + 12}px` }}
                onClick={() => alert('该服务需前往「指令交易(模拟)权限申请」页面单独申请开通')}
              >
                <div className="flex items-center flex-1 min-w-0">
                  <div className="w-6 flex items-center justify-center mr-1 shrink-0"></div>
                  <div className="relative flex items-center mr-2.5">
                    <input
                      type="checkbox"
                      checked={false}
                      disabled
                      className="h-4 w-4 rounded border-gray-300 text-gray-400 cursor-not-allowed opacity-50"
                      id={`check-${item.id}`}
                    />
                  </div>
                  <label className="text-sm flex-1 truncate cursor-pointer py-0.5 text-gray-400">
                    {item.label}
                    <span className="ml-2 px-1 py-0.5 bg-gray-100 text-gray-500 text-[10px] rounded border border-gray-200 font-normal">需单独申请</span>
                  </label>
                </div>
                <button
                  className="ml-2 text-[11px] text-orange-500 opacity-100 hover:underline shrink-0 cursor-pointer"
                  onClick={(e) => { e.stopPropagation(); alert('跳转至「指令交易(模拟)权限申请」页面'); }}
                >
                  前往申请
                </button>
              </div>
            </div>
          );
        }

        return (
          <div key={item.id} className="select-none">
            <div
              className="flex items-center py-2 px-3 hover:bg-blue-50/50 cursor-pointer group transition-colors"
              style={{ paddingLeft: `${depth * 16 + 12}px` }}
              onClick={() => toggleSelect(item.id)}
            >
              <div className="flex items-center flex-1 min-w-0">
                <div className="w-6 flex items-center justify-center mr-1 shrink-0">
                  {item.children && (
                    <button
                      onClick={(e) => { e.stopPropagation(); toggleExpand(item.id); }}
                      className="p-0.5 hover:bg-gray-200 rounded transition-colors text-gray-400 cursor-pointer"
                    >
                      {isExpanded ? <Icons.ChevronDown /> : <Icons.ChevronRight />}
                    </button>
                  )}
                </div>
                <div className="relative flex items-center mr-2.5">
                  <input
                    type="checkbox"
                    checked={isSelected}
                    ref={el => { if (el) el.indeterminate = isPartial; }}
                    onChange={() => {}}
                    className="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                    id={`check-${item.id}`}
                  />
                </div>
                <label className={`text-sm flex-1 truncate cursor-pointer py-0.5 ${isSelected ? 'text-blue-600 font-semibold' : 'text-gray-700'}`}>
                  {item.label}
                  {item.id === '1-1' && <span className="ml-2 px-1 py-0.5 bg-green-50 text-green-600 text-[10px] rounded border border-green-100 font-normal">管理员模式</span>}
                  {item.id === '4' && <span className="ml-2 px-1 py-0.5 bg-indigo-50 text-indigo-600 text-[10px] rounded border border-indigo-100 font-normal">企业签约认证</span>}
                  {(item.id === '1-3' || item.id === '2' || item.id === '3') && <span className="ml-2 px-1 py-0.5 bg-orange-50 text-orange-600 text-[10px] rounded border border-orange-100 font-normal">操作员模式</span>}
                </label>
                {item.hasInfo && <Icons.Info className="ml-1.5 text-gray-300 group-hover:text-blue-400 transition-colors shrink-0" />}
              </div>
              {(item.id === '1' || item.id === '1-2' || item.id === '2') && (
                <button
                  className="ml-2 text-[11px] text-blue-500 opacity-0 group-hover:opacity-100 hover:underline shrink-0 cursor-pointer"
                  onClick={(e) => { e.stopPropagation(); alert('查看申请材料'); }}
                >
                  材料指南
                </button>
              )}
            </div>
            {item.children && isExpanded && (
              <div className="overflow-hidden border-l border-gray-100 ml-4 animate-slide-down">
                {item.children.map(child => renderItem(child, depth + 1))}
              </div>
            )}
          </div>
        );
      };

      return (
        <div className="bg-white border border-gray-200 rounded-lg shadow-xl w-[360px] absolute z-50 mt-1.5 left-0 top-full overflow-hidden flex flex-col max-h-[480px]">
          <div className="p-2.5 border-b border-gray-100 bg-gray-50/50 flex items-center gap-2">
            <div className="relative flex-1">
              <Icons.Search className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400" style={{ top: '50%', transform: 'translateY(-50%)' }} />
              <input
                type="text"
                placeholder="搜索权限类型..."
                className="w-full bg-white border border-gray-200 rounded-md py-1.5 pl-8 pr-3 text-xs focus:outline-none focus:ring-1 focus:ring-blue-400 focus:border-blue-400"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
            </div>
            <button onClick={handleClearAll} className="text-xs text-gray-500 hover:text-red-500 flex items-center gap-1 shrink-0 px-1 py-1 cursor-pointer">
              <Icons.XCircle /> 清空
            </button>
          </div>
          <div className="flex-1 overflow-y-auto py-1 custom-scrollbar">
            {filteredMenuData.length > 0 ? filteredMenuData.map(item => renderItem(item)) : (

    const downloadMaterialTemplates = async (names) => {
      let store;
      try { store = window.parent !== window ? window.parent.MaterialTemplateStore : null; } catch (error) {}
      if (!store) { alert('模板服务未连接，请从用户中心打开本页面，并在档案中心上传模板。'); return; }
      const results = await Promise.all(names.map(async name => {
        try {
          const code = store.codeForName(name);
          if (!code) return { name, error: '未配置材料编码' };
          const record = await store.getLatest(code);
          return record ? { name, record } : { name, error: '尚未上传模板' };
        } catch (error) { return { name, error: error.message }; }
      }));
      const missing = results.filter(item => item.error);
      const ready = results.filter(item => item.record);
      if (missing.length) alert('以下材料暂不可下载：' + missing.map(item => item.name + '（' + item.error + '）').join('；') + '。请在档案中心上传模板或重试。');
      if (ready.length > 1) alert('将下载 ' + ready.length + ' 份最新模板；如浏览器提示，请允许本页下载多个文件。');
      ready.forEach(item => {
        try { store.downloadFile(item.record); }
        catch (error) { alert('模板下载未发起：' + item.name + '（' + error.message + '）'); }
      });

    // ========== HistoryModal Component ==========
    const VersionFilter = ({ value, allVersions, isOfficial, selectedVersion, onSelect }) => {
      const [isOpen, setIsOpen] = useState(false);
      const [position, setPosition] = useState({});
      const triggerRef = useRef(null);
      const menuRef = useRef(null);
      const options = [{ value: '', label: '全部版本' }, ...allVersions.map(version => ({ value: version, label: version }))];
      const closeMenu = () => { setIsOpen(false); triggerRef.current?.focus(); };
      const openMenu = () => {
        const rect = triggerRef.current.getBoundingClientRect();
        const height = Math.min(208, options.length * 32 + 8);
        const below = window.innerHeight - rect.bottom - 12;
        const above = rect.top - 12;
        const upward = below < height && above > below;
        const maxHeight = Math.min(height, Math.max(64, upward ? above : below));
        setPosition({ position: 'fixed', zIndex: 200, width: 184, maxHeight,
          left: Math.max(8, Math.min(rect.left, window.innerWidth - 192)),
          top: upward ? rect.top - maxHeight - 4 : rect.bottom + 4 });
        setIsOpen(true);
      };

      useEffect(() => {
        if (!isOpen) return;
        const selected = menuRef.current?.querySelector('[aria-selected="true"]');
        (selected || menuRef.current?.querySelector('[role="option"]'))?.focus();
        const onOutside = event => {
          if (!triggerRef.current?.contains(event.target) && !menuRef.current?.contains(event.target)) setIsOpen(false);
        };
        const onScroll = event => { if (!menuRef.current?.contains(event.target)) setIsOpen(false); };
        const onResize = () => setIsOpen(false);
        document.addEventListener('mousedown', onOutside);
        window.addEventListener('scroll', onScroll, true);
        window.addEventListener('resize', onResize);
        return () => {
          document.removeEventListener('mousedown', onOutside);
          window.removeEventListener('scroll', onScroll, true);
          window.removeEventListener('resize', onResize);
        };
      }, [isOpen]);

      const onMenuKey = event => {
        if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeMenu(); return; }
        if (event.key === 'Tab') { setIsOpen(false); return; }
        if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const items = Array.from(menuRef.current.querySelectorAll('[role="option"]'));
        const current = items.indexOf(document.activeElement);
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? items.length - 1 : (current + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items[next].focus();
      };
      const baseBadgeCls = isOfficial
        ? 'inline-flex items-center gap-1 bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-[11px] font-medium border border-purple-200 hover:bg-purple-200 hover:border-purple-300 transition-colors'
        : 'inline-flex items-center gap-1 text-gray-700 font-mono text-[12px] hover:bg-gray-100 px-2 py-0.5 rounded border border-transparent hover:border-gray-200 transition-colors';

      return (
        <>
          <button ref={triggerRef} type="button" aria-label={`筛选附件版本：${value}`} aria-haspopup="listbox" aria-expanded={isOpen}
            title="点击下拉筛选版本" className={`${baseBadgeCls} cursor-pointer focus:outline-none focus:ring-2 focus:ring-purple-300`}
            onClick={() => isOpen ? closeMenu() : openMenu()}
            onKeyDown={event => { if (event.key === 'ArrowDown' || event.key === 'ArrowUp') { event.preventDefault(); openMenu(); } }}>
            {isOfficial && <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>}
            {value}<Icons.ChevronDown />
          </button>
          {isOpen && ReactDOM.createPortal(
            <div ref={menuRef} role="listbox" aria-label="附件版本筛选" style={position} onKeyDown={onMenuKey}
              className="bg-white border border-gray-200 rounded-md shadow-lg overflow-y-auto py-1">
              {options.map(option => <button type="button" role="option" tabIndex={-1} aria-selected={selectedVersion === option.value}
                key={option.value} className={`block w-full px-3 py-2 text-left text-xs hover:bg-purple-50 focus:bg-purple-50 focus:outline-none ${selectedVersion === option.value ? 'text-purple-700 bg-purple-50 font-medium' : 'text-gray-700'}`}
                onClick={() => { onSelect(option.value); closeMenu(); }}>{option.label}</button>)}
            </div>, document.body)}
        </>
      );
    };

        if (officialOverride) return officialOverride;
        const cur = (file && file.history ? file.history.find(h => h.isCurrent) : null) || (file && file.history && file.history[0]);
        return cur ? cur.version : null;

      const [officialVersion, setOfficialVersion] = useState(resolveOfficial);

      // file 切换时（打开不同文件的弹窗）重置选中

                    return (

                      </td>

                  <FormField label="客户证件号码"><Input value={reviewData.customerId} disabled /></FormField>
                  <FormField label="业务类型"><Input value={reviewData.businessType} disabled /></FormField>
                  <FormField label="是否使用标准协议"><Input value={reviewData.useStandardAgreement} disabled /></FormField>
                  <FormField label="申请权限类型">
                    <div className="flex flex-wrap gap-1.5 items-center bg-gray-50 border border-gray-200 rounded-md p-2 min-h-[40px]">
                      {reviewData.permissionTypes.map((label, idx) => (
                        <span key={idx} className="inline-flex items-center gap-1 px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-xs border border-blue-100 font-medium">
                          {label}
                        </span>
                      ))}
                    </div>
                  </FormField>
                  <FormField label="客户风险等级"><Input value={reviewData.riskLevel} disabled /></FormField>
                  <FormField label="客户战略等级"><Input value={reviewData.strategyLevel} disabled /></FormField>
                  {hasBrokerageSelectedInReview && (
                    <>
                      <FormField label="管理员账号密码接收邮箱"><Input value={reviewData.adminEmail} disabled /></FormField>
                      <FormField label="硬件密码设备邮寄地址"><Input value={reviewData.hardwareAddress} disabled /></FormField>
                    </>
                  )}
                </div>
              </section>

              {/* 备注 Section */}
              <section className="mb-10">
                <FormField label="备注">
                  <textarea
                    className="w-full border border-gray-200 rounded-md px-3 py-2 text-sm bg-gray-50 min-h-[100px] resize-none"
                    value={reviewData.remarks}
                    disabled
                  ></textarea>
                </FormField>
              </section>

              {/* 附件材料 */}
              <section className="space-y-6">
                {reviewData.attachments.map((attachment, idx) => (
                  <AttachmentTable
                    key={idx}
                    title="附件( 机构一站式服务平台使用协议 )"
                    materialName="机构一站式服务平台使用协议"
                    attachments={[attachment]}
                    hasTemplate={true}
                    onShowHistory={handleShowHistory}
                  />
                ))}
              </section>
              </>
            )}
          </main>

          <MobileApplyModal isOpen={showMobileModal} onClose={() => setShowMobileModal(false)} />
          <HistoryModal
            isOpen={showHistoryModal}
            onClose={() => setShowHistoryModal(false)}
            file={historyFile}
            officialOverride={historyFile ? officialByFile[historyFile.name] : null}
            onSetOfficial={handleSetOfficial}
          />
        </div>
      );
    };

    // ========== Render App ==========
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
